name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create source archive
      run: |
        tar -czf python-syntax-highlighter.tar.gz \
          --exclude-vcs \
          --exclude ".venv" \
          --exclude "__pycache__" \
          --exclude "site" \
          .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-syntax-highlighter
        path: python-syntax-highlighter.tar.gz

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: python-syntax-highlighter.tar.gz
