name: Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install MkDocs
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs

    - name: Build site
      run: |
        mkdocs build

    - name: Upload site artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: site
