name: Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Cache MkDocs dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-mkdocs-${{ hashFiles('.github/workflows/docs.yml') }}
        restore-keys: |
          ${{ runner.os }}-mkdocs-

    - name: Install MkDocs
      run: pip install mkdocs mkdocs-material

    - name: Build site
      run: mkdocs build

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
